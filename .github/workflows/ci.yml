name: CI

# รันเมื่อ push/PR เข้า main และกดรันเองได้จากแท็บ Actions
#
# หมายเหตุเรื่อง Node: เทสต์ของโปรเจกต์นี้ import ไฟล์ `.ts` ตรง ๆ แล้วรันด้วย `node --test`
# (ใช้ type stripping ของ Node เอง ไม่มี vitest/jest) → ต้องเป็น Node ที่ strip types ให้อัตโนมัติ
#   - Node 20 ใช้ไม่ได้ (ทดสอบแล้ว: v20.19.2 ล้มด้วย ERR_UNKNOWN_FILE_EXTENSION)
#   - Node 22.18.0 ขึ้นไปใช้ได้โดยไม่ต้องใส่ flag (ทดสอบแล้ว: 146/146 ผ่าน ไม่มี env พิเศษ)
#   - เลือก 24.x เพราะเป็น LTS (Krypton) ที่ยังได้รับการสนับสนุนยาวกว่า 22 และทดสอบแล้วว่า 146/146 ผ่านเหมือนกัน
#     (เครื่อง dev ใช้ 26.8.2 ซึ่งยังเป็น Current ไม่ใช่ LTS — ไม่เลือกเป็นตัว pin ของ CI)
# ถ้าอนาคตอัปเป็น 26 LTS ให้แก้ที่จุดเดียวนี้
#
# เวอร์ชันของ action: ใช้ v7 (release ล่าสุด ณ 2026-09: checkout v7.0.1, setup-node v7.0.0)
# เหตุผล: ต้องเป็น action ที่ประกาศ `runs.using: node24` ไม่งั้น GitHub ขึ้น annotation ว่า
#   "Node.js 20 is deprecated ... forced to run on Node.js 24" — ตรวจ action.yml จริงแล้วว่า v5/v6/v7 ใช้ node24 ทั้งหมด
#   เลือก v7 (ตัวล่าสุด) เพื่อไม่ให้ workflow เก่าตั้งแต่เกิด และยืนยันว่าอินพุตที่ใช้ (node-version, cache) ยังมีใน v7
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# อ่านโค้ดอย่างเดียวพอ — ไม่มีขั้นตอนไหนต้องเขียนกลับ repo
permissions:
  contents: read

jobs:
  verify:
    name: type-check · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # env ปลอมสำหรับ build — CI ต้องไม่ต่อ DB จริงและไม่มี secret จริงอยู่ในไฟล์นี้
      # BETTER_AUTH_URL ต้องเป็น https เพราะ createAuth() fail-fast เมื่อ production ไม่ใช่ https (src/lib/auth-env.ts)
      BETTER_AUTH_URL: https://example.com
      BETTER_AUTH_SECRET: ci-dummy-secret-not-a-real-credential-000000
      # DATABASE_URL ปลอม (ไม่ใช่ credential จริง ไม่มีใครเชื่อมต่อ):
      #   ไม่ตั้ง = build ผ่านก็จริง แต่ getAuth() จะล้มด้วย "DATABASE_URL ไม่ได้ตั้งไว้" ก่อน headers() ถูกเรียก
      #   → Next จัดหน้า /, /summary, /transactions, /settings/* เป็น ○ static ผิด (ของจริงต้องเป็น ƒ dynamic)
      #   วัดแล้ว: ใส่ค่านี้ทำให้ classification ตรงกับ production และ **ไม่มีการเชื่อมต่อออกไปเลย** (0 connection error, build 23s)
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci-placeholder-never-connected
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      # ไม่ใช้ `npm run lint` (script นี้เป็น pattern ของ session นี้) — เรียก eslint ตรง ๆ
      - name: Lint
        run: ./node_modules/.bin/eslint .

      # เทสต์ทั้งหมดของโปรเจกต์ — เรียกผ่าน `npm test` เพื่อใช้คำสั่งเดียวกับนักพัฒนา/README
      # (`node --test src/` ให้ตัวรันของ Node ค้นหาไฟล์เทสต์เอง ⇒ ไฟล์ใหม่ถูกเก็บอัตโนมัติ ไม่มีรายชื่อให้เน่า)
      - name: Test
        run: npm test

      - name: Build
        run: npx next build

      # prod smoke: สตาร์ทเซิร์ฟเวอร์ production จริงแล้วยิง HTTP ตรวจ (ไม่ใช้เบราว์เซอร์)
      #   - พอร์ตตายตัว (3600) ไม่ชนกับอะไรใน runner · ใช้ env ปลอมชุดเดียวกับ build (ไม่มี secret จริง)
      #   - รันผ่าน ./node_modules/.bin/next ตรง ๆ (ไม่ใช่ npx) เพราะ npx เป็น process แม่ที่ spawn ลูกอีกชั้น
      #     → kill แล้วตัวเซิร์ฟเวอร์จริงจะกลายเป็น process กำพร้าค้าง job (ทดสอบแล้วในเครื่อง: npx ค้าง, direct binary ไม่ค้าง)
      #   - trap EXIT ทำให้ kill ทุกกรณี (รวมตอน step ล้ม)
      - name: Prod smoke
        run: |
          set -euo pipefail
          PORT=3600
          ./node_modules/.bin/next start -p "$PORT" > /tmp/next-start.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          # รอให้พร้อมจริง (สูงสุด 60 วิ) — poll endpoint ที่ไม่ต้องมี session
          for attempt in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:$PORT/login" > /dev/null; then
              echo "server พร้อมหลัง ${attempt} วิ"
              break
            fi
            sleep 1
          done

          node scripts/prod-smoke.mjs "http://127.0.0.1:$PORT"


  # e2e ที่มี session จริง — ตรวจ flow ที่ต้องล็อกอิน (ยอดเงิน · รายการ · งบ · ถังขยะ · ส่งออก · ตั้งค่าอีเมล)
  #
  # ⚠ ทำไมต้องเป็น Neon เท่านั้น (ห้ามกลับไปใช้ `services: postgres`)
  #   แอปต่อ DB ผ่านไดรเวอร์ HTTP ของ Neon (`@neondatabase/serverless` ใน src/db/index.ts) ⇒ ต่อ Postgres ธรรมดาไม่ได้
  #   หลักฐานจากการรันจริงบน GitHub ด้วย service postgres:17: `npm run migrate` ผ่าน (drizzle-kit ใช้ pg)
  #   แต่ทุกหน้าของแอปได้ข้อมูลว่าง และ /export/transactions ตอบ 503 ⇒ เป็นข้อจำกัดของไดรเวอร์ ไม่ใช่บั๊กของสคริปต์
  #   การเพิ่มไดรเวอร์ที่สองเข้าแอปเพื่อ CI = รองรับ deployment ที่ PLAN ไม่ได้เลือก + เพิ่มพื้นผิวเสี่ยง ⇒ ไม่ทำ
  #
  # ⇒ job นี้รันเมื่อมี secret `E2E_DATABASE_URL` (Neon branch สำหรับ CI) เท่านั้น
  #   ไม่มี secret = **ข้ามอย่างชัดเจน ไม่แดง** (step เดียวที่พิมพ์บอกว่าข้าม) — และไม่ได้ถือว่า "ผ่าน"
  #   หมายเหตุ: ใช้ URL เดียวกันทั้ง pooled/direct เพราะ runner ไม่ได้รันแบบ concurrent จริง
  #   (ถ้าวันหนึ่งต้องการ pooled แยก ให้เพิ่ม secret ที่สองแล้วตั้ง DATABASE_URL จากตัวนั้น)
  e2e:
    name: e2e smoke (Neon · มี session จริง)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
    steps:
      - name: ไม่มี secret E2E_DATABASE_URL — ข้าม job นี้
        if: env.E2E_DATABASE_URL == ''
        run: |
          echo "::notice title=e2e smoke ถูกข้าม::ยังไม่ได้ตั้ง secret E2E_DATABASE_URL (Neon branch สำหรับ CI)"
          echo "job นี้ต้องรันกับ Neon เท่านั้น เพราะแอปใช้ไดรเวอร์ HTTP ของ Neon (ดูคอมเมนต์หัว job)"
          echo "สถานะ: ข้าม (skip) — ไม่ได้รัน build/start/e2e เลย จึงไม่ถือว่าผ่าน"

      - name: Checkout
        if: env.E2E_DATABASE_URL != ''
        uses: actions/checkout@v7

      - name: Setup Node
        if: env.E2E_DATABASE_URL != ''
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        if: env.E2E_DATABASE_URL != ''
        run: npm ci

      # drizzle-kit อ่าน DATABASE_URL_DIRECT (drizzle.config.ts) — ส่งผ่าน env ไม่ interpolate ลง command (กัน secret หลุด log)
      - name: Migrate schema (Neon)
        if: env.E2E_DATABASE_URL != ''
        env:
          DATABASE_URL_DIRECT: ${{ secrets.E2E_DATABASE_URL }}
        run: npm run migrate

      - name: Build
        if: env.E2E_DATABASE_URL != ''
        env:
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          BETTER_AUTH_URL: https://example.com
          BETTER_AUTH_SECRET: ci-e2e-dummy-secret-not-a-real-credential-000000
        run: npx next build

      - name: Start server + run e2e smoke
        if: env.E2E_DATABASE_URL != ''
        env:
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          DATABASE_URL_DIRECT: ${{ secrets.E2E_DATABASE_URL }}
          BETTER_AUTH_URL: https://example.com
          BETTER_AUTH_SECRET: ci-e2e-dummy-secret-not-a-real-credential-000000
        run: |
          set -euo pipefail
          PORT=3601
          ./node_modules/.bin/next start -p "$PORT" > /tmp/next-e2e.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:$PORT/login" > /dev/null; then
              echo "server พร้อมหลัง ${attempt} วิ"
              break
            fi
            sleep 1
          done

          # สคริปต์ seed/ตรวจ/ล้างข้อมูลเองทั้งหมด (มี signal handler ล้างเมื่อถูกยกเลิกด้วย)
          BASE_URL="http://127.0.0.1:$PORT" node scripts/e2e-smoke.mjs
